# ============================================================
# mosquitto.conf — Configuração do Broker MQTT
# ============================================================

# Porta padrão MQTT
listener 1883

# Permitir conexões anônimas (ambiente de desenvolvimento)
allow_anonymous true

# Habilitar WebSockets na porta 9001 (opcional, para debug via browser)
listener 9001
protocol websockets

# Log
log_type all
log_dest stdout

# Persistência de sessão
persistence true
persistence_location /tmp/mosquitto/